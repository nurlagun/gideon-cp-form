<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e3e8f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#353a3e" media="(prefers-color-scheme: dark)">
  <title>Church Presentation Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #e3e8f1;
      --shadow-dark: #a6b1c7;
      --shadow-light: #ffffff;
      --card-grad: linear-gradient(145deg, #eef2f9, #d9e0ec);
      --ink: #1b2437;
      --ink-soft: #3f5a72;
      --label: #022f4b;
      --accent: #f4600c;
      --head: #022f4b;
      --gold: #b8963a;
      --ph: #7a8ba0;
      --hover: #dbe2ee;
      --warn: #8a5a07;
      --req: #c0392b;
      --dot-ring: rgba(2,47,75,0.15);
      --ok-bg: #e3f3e8;
      --ok-ink: #14633a;
      --err-bg: #fbe6e6;
      --err-ink: #9b1c1c;
      --btn-1: #f77a2e;
      --btn-2: #d9500a;
      --btn-shadow: 10px 10px 22px #9aa6bd, -10px -10px 22px #ffffff;
      --raised: 12px 12px 26px var(--shadow-dark), -12px -12px 26px var(--shadow-light);
      --raised-sm: 6px 6px 13px var(--shadow-dark), -6px -6px 13px var(--shadow-light);
      --inset: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #353a3e;
        --shadow-dark: #1f2224;
        --shadow-light: #4a5055;
        --raised: 10px 10px 18px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
        --raised-sm: 6px 6px 10px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
        --inset: inset 6px 6px 10px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        --card-grad: linear-gradient(145deg, #3d4348, #30353a);
        --ink: #e6e8eb;
        --ink-soft: #b2b9c3;
        --head: #e6d3a0;
        --label: #efdca8;
        --accent: #ff8a4a;
        --gold: #d4b46a;
        --ph: #7b828c;
        --hover: #3d4348;
        --warn: #e8b95f;
        --req: #ff8a78;
        --dot-ring: rgba(230,211,160,0.2);
        --ok-bg: #1f3a2d;
        --ok-ink: #8fe0b0;
        --err-bg: #43262c;
        --err-ink: #ffb4b4;
        --btn-shadow: 9px 9px 16px #1b1e20, -5px -5px 12px #484e53, 0 0 24px rgba(247,122,46,0.32);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-padding-top: 16px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      padding: max(18px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    }

    .app { max-width: 480px; margin: 0 auto; }

    /* Header */
    .head { display: flex; align-items: center; gap: 16px; padding: 4px 4px 18px; }
    .emblem {
      flex: none; width: 68px; height: 68px; border-radius: 50%;
      background: var(--card-grad); box-shadow: var(--raised);
      display: grid; place-items: center; padding: 5px;
    }
    .emblem img { width: 100%; height: 100%; border-radius: 50%; display: block; }
    .head h1 { margin: 0; font-size: 21px; line-height: 1.2; font-weight: 800; color: var(--head); letter-spacing: -0.01em; }
    .head p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-soft); font-weight: 500; }

    .intro { margin: 0 4px 16px; font-size: 13.5px; color: var(--ink-soft); }

    /* Directory status pill */
    .badge {
      display: flex; align-items: center; gap: 10px;
      margin: 0 0 20px; padding: 11px 16px; border-radius: 999px;
      background: var(--bg); box-shadow: var(--inset);
      font-size: 12.5px; font-weight: 700; color: var(--head);
    }
    .badge::before {
      content: ""; flex: none; width: 10px; height: 10px; border-radius: 50%;
      background: var(--head); box-shadow: 0 0 0 3px var(--dot-ring);
    }
    .badge.new { color: var(--warn); }
    .badge.new::before { background: var(--gold); box-shadow: 0 0 0 3px rgba(199,154,59,0.25); }

    /* Section cards */
    .section {
      background: var(--card-grad); border-radius: 40px; box-shadow: var(--raised);
      padding: 26px 20px 10px; margin-bottom: 30px;
    }
    .section > h2 {
      position: relative; margin: 0 0 22px; padding: 2px 0 18px;
      font-size: 21px; line-height: 1.2; font-weight: 800; letter-spacing: -0.01em; color: var(--head);
      display: flex; align-items: center; gap: 14px;
    }
    .section > h2::after {
      content: ""; position: absolute; left: 4px; right: 4px; bottom: 0; height: 5px;
      border-radius: 5px; background: var(--bg); box-shadow: var(--inset);
    }
    .section > h2 i {
      flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--card-grad);
      box-shadow: var(--raised-sm); display: grid; place-items: center; font-style: normal;
    }
    .section > h2 svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }

    .group { margin-bottom: 16px; position: relative; }
    label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; letter-spacing: 0.01em; margin: 0 0 9px 12px; color: var(--label); }
    label::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
    label span.req { color: var(--accent); font-weight: 800; }

    input, select, textarea {
      width: 100%; padding: 14px 22px; border: 0; border-radius: 999px;
      font: inherit; font-size: 15px; font-weight: 500; color: var(--ink);
      background: var(--bg); box-shadow: var(--inset);
      transition: box-shadow .15s ease;
    }
    input::placeholder, textarea::placeholder { color: var(--ph); }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    select {
      appearance: none; -webkit-appearance: none; padding-right: 48px;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--head) 50%),
        linear-gradient(135deg, var(--head) 50%, transparent 50%);
      background-position: calc(100% - 28px) 52%, calc(100% - 22px) 52%;
      background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;
    }
    textarea { resize: vertical; min-height: 84px; border-radius: 26px; }
    input[type="date"], input[type="time"] { min-height: 48px; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    @media (max-width: 440px) { .row { grid-template-columns: 1fr; } }

    .hidden { display: none; margin-top: 10px; }

    /* Suggestions */
    .suggestions {
      position: absolute; top: calc(100% - 6px); left: 0; right: 0; z-index: 99; display: none;
      max-height: 250px; overflow-y: auto; border-radius: 26px; padding: 8px;
      background: var(--bg); box-shadow: 8px 10px 22px var(--shadow-dark), -6px -6px 16px var(--shadow-light);
    }
    .sug-item { padding: 11px 16px; cursor: pointer; border-radius: 18px; }
    .sug-item:hover, .sug-item:active { background: var(--hover); }
    .sug-title { font-weight: 700; font-size: 14px; color: var(--ink); }
    .sug-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

    /* Submit */
    button {
      width: 100%; border: 0; padding: 18px; border-radius: 999px; cursor: pointer;
      font: inherit; font-size: 16px; font-weight: 800; color: #fff; letter-spacing: 0.01em;
      background: linear-gradient(145deg, var(--btn-1), var(--btn-2));
      box-shadow: var(--btn-shadow);
      transition: box-shadow .15s ease, transform .15s ease;
    }
    button:active:not(:disabled) { transform: scale(0.99); box-shadow: inset 4px 4px 10px rgba(0,0,0,0.35), inset -3px -3px 8px rgba(255,255,255,0.12); }
    button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    button:disabled { background: var(--bg); box-shadow: var(--inset); color: var(--ink-soft); cursor: not-allowed; }

    #status {
      margin-top: 24px; padding: 18px 22px; border-radius: 30px; display: none;
      font-size: 14px; font-weight: 600; background: var(--bg); box-shadow: var(--raised-sm);
    }
    #status.ok { background: var(--ok-bg); color: var(--ok-ink); }
    #status.err { background: var(--err-bg); color: var(--err-ink); }

    .foot { text-align: center; margin: 22px 0 0; font-size: 12px; color: var(--ink-soft); font-weight: 600; }


    /* Layout: columns stack on mobile, sit side by side on desktop */
    .cols { display: block; }
    .col { min-width: 0; }
    .actions { max-width: 480px; margin: 0 auto; }
    #status { max-width: 480px; margin-left: auto; margin-right: auto; }

    /* Tablet */
    @media (min-width: 600px) {
      body { padding-left: 28px; padding-right: 28px; }
      .app { max-width: 600px; }
      .section { padding: 26px 26px 10px; }
      .head h1 { font-size: 24px; }
    }

    /* Desktop */
    @media (min-width: 1000px) {
      body { padding-top: 40px; padding-bottom: 56px; font-size: 15.5px; }
      .app { max-width: 1080px; }
      .head { padding-bottom: 22px; gap: 20px; }
      .emblem { width: 80px; height: 80px; }
      .head h1 { font-size: 28px; }
      .head p { font-size: 14px; }
      .intro { max-width: 640px; font-size: 14.5px; margin-bottom: 20px; }
      .badge { display: inline-flex; margin-bottom: 28px; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; align-items: start; }
      .section { margin-bottom: 30px; padding: 30px 28px 12px; }
      .section > h2 { font-size: 23px; }
      .actions { max-width: 420px; margin-top: 4px; }
      button { transition: box-shadow .15s ease, transform .15s ease; }
      button:hover:not(:disabled) { transform: translateY(-1px); }
      input:hover, select:hover, textarea:hover { box-shadow: inset 7px 7px 14px var(--shadow-dark), inset -7px -7px 14px var(--shadow-light); }
    }

    /* Dark-mode extras (placed last so they win over the base styles) */
    @media (prefers-color-scheme: dark) {
      body { background: radial-gradient(560px 340px at 12% -60px, rgba(247,122,46,0.16), transparent 70%), radial-gradient(460px 320px at 100% 18%, rgba(230,211,160,0.08), transparent 70%), var(--bg); }
      .section { box-shadow: var(--raised), inset 0 1px 0 rgba(255,255,255,0.06); }
      .emblem { box-shadow: var(--raised), 0 0 0 1px rgba(230,211,160,0.22), 0 0 22px rgba(247,122,46,0.18); }
      .section > h2::before { content: ""; position: absolute; left: 4px; bottom: 0; width: 38%; height: 5px; border-radius: 5px; z-index: 1; background: linear-gradient(90deg, #f77a2e, #e6c06a); box-shadow: 0 0 12px rgba(247,122,46,0.55); }
      .section > h2 i { box-shadow: var(--raised-sm), 0 0 16px rgba(247,122,46,0.20); }
      .section > h2 svg { filter: drop-shadow(0 0 4px rgba(255,138,74,0.65)); }
      input:focus, select:focus, textarea:focus { box-shadow: var(--inset), 0 0 18px rgba(255,138,74,0.35); }
      .badge::before { box-shadow: 0 0 0 3px var(--dot-ring), 0 0 12px rgba(230,211,160,0.5); }
    }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>

      <div>
        <h1>Church Presentation Details</h1>
        <p>Gideons International</p>
      </div>
    </header>

    <p class="intro">Dearly Beloved, thank you for procuring a new Church Presentation. Type the church name to fill in verified directory details, or enter a new church.</p>
    <div id="dirBadge" class="badge">Loading Church Directory...</div>

    <form id="presForm" onsubmit="handleSubmit(event)">

      <div class="cols">
      <div class="col">
      <!-- CHURCH -->
      <section class="section">
        <h2><i><svg viewBox="0 0 24 24"><path d="M12 3v4M10 5h4M5 21V11l7-4 7 4v10zM10 21v-5h4v5"/></svg></i>Church</h2>

        <div class="group">
          <label>Name of the Church <span class="req">*</span></label>
          <input type="text" id="churchName" required autocomplete="off" placeholder="Type 2+ letters to search the directory">
          <div id="suggestions" class="suggestions"></div>
        </div>

        <div class="row">
          <div class="group">
            <label>Camp Name <span class="req">*</span></label>
            <select id="campName" required><option value="">Loading Camps...</option></select>
          </div>
          <div class="group">
            <label>Date of Presentation <span class="req">*</span></label>
            <input type="date" id="presDate" required>
          </div>
        </div>

        <div class="row">
          <div class="group">
            <label>Denomination <span class="req">*</span></label>
            <select id="denomination" required onchange="toggleOther('denomination', 'denomOther')">
              <option value="CSI">CSI</option>
              <option value="AG">AG</option>
              <option value="Baptist">Baptist</option>
              <option value="ECI">ECI</option>
              <option value="Independent" selected>Independent</option>
              <option value="Luthern">Luthern</option>
              <option value="Methodist">Methodist</option>
              <option value="Acts">Acts</option>
              <option value="IPC">IPC</option>
              <option value="Other">Other</option>
            </select>
            <input type="text" id="denomOther" class="hidden" placeholder="Enter Denomination">
          </div>
          <div class="group">
            <label>Pincode <span class="req">*</span></label>
            <input type="text" id="pincode" required inputmode="numeric" placeholder="e.g. 560066">
          </div>
        </div>

        <div class="group">
          <label>Church Address <span class="req">*</span></label>
          <input type="text" id="address" required placeholder="Street / Locality / City">
        </div>

        <div class="row">
          <div class="group"><label>Church Area</label><input type="text" id="area"></div>
          <div class="group"><label>Landmark</label><input type="text" id="landmark"></div>
        </div>
      </section>

      <!-- PASTOR -->
      <section class="section">
        <h2><i><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></i>Pastor</h2>

        <div class="row">
          <div class="group"><label>Pastor Prefix <span class="req">*</span></label><input type="text" id="pastorPrefix" value="Pastor" required></div>
          <div class="group"><label>Pastor Name <span class="req">*</span></label><input type="text" id="pastorName" required></div>
        </div>

        <div class="row">
          <div class="group"><label>Pastor Contact Number <span class="req">*</span></label><input type="tel" id="pastorPhone" required placeholder="e.g. 9845012345"></div>
          <div class="group"><label>Alternate Number &amp; Name</label><input type="text" id="altContact"></div>
        </div>

        <div class="group"><label>Pastor Mail ID</label><input type="email" id="pastorEmail"></div>
      </section>

      </div>
      <div class="col">
      <!-- SERVICE -->
      <section class="section">
        <h2><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></i>Service</h2>

        <div class="row">
          <div class="group">
            <label>Service Language - Primary <span class="req">*</span></label>
            <select id="primaryLang" required>
              <option value="Tamil">Tamil</option>
              <option value="Kannada">Kannada</option>
              <option value="English" selected>English</option>
              <option value="Telugu">Telugu</option>
              <option value="Malayalam">Malayalam</option>
              <option value="Hindi">Hindi</option>
              <option value="Nepali">Nepali</option>
            </select>
          </div>
          <div class="group">
            <label>Translation Available</label>
            <select id="translationAvail"><option value="No">No</option><option value="Yes">Yes</option></select>
          </div>
        </div>

        <div class="group">
          <label>Service Language - Secondary</label>
          <select id="secondaryLang">
            <option value="">None</option>
            <option value="Kannada">Kannada</option>
            <option value="Tamil">Tamil</option>
            <option value="English">English</option>
            <option value="Telugu">Telugu</option>
            <option value="Malayalam">Malayalam</option>
            <option value="Hindi">Hindi</option>
          </select>
        </div>

        <div class="row">
          <div class="group"><label>Service Start Time <span class="req">*</span></label><input type="time" id="startTime" value="10:00" required></div>
          <div class="group"><label>Service End Time <span class="req">*</span></label><input type="time" id="endTime" value="12:00" required></div>
        </div>

        <div class="row">
          <div class="group"><label>LCD Projector</label><select id="lcdProjector"><option value="Yes">Yes</option><option value="No">No</option></select></div>
          <div class="group"><label>Sermon Required <span class="req">*</span></label><select id="sermonRequired" required><option value="Yes">Yes</option><option value="No">No</option></select></div>
        </div>

        <div class="row">
          <div class="group"><label>Duration for Sermon &amp; Presentation <span class="req">*</span></label><input type="text" id="duration" value="40 mins" required></div>
          <div class="group">
            <label>Offering Type <span class="req">*</span></label>
            <select id="offeringType" required>
              <option value="Main Offering">Main Offering</option>
              <option value="Retiring Offering">Retiring Offering</option>
              <option value="No Offering">No Offering</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="group"><label>Congregation Size <span class="req">*</span></label><input type="number" id="congregationSize" value="100" required inputmode="numeric"></div>
          <div class="group"><label>Expected Offering</label><input type="number" id="expectedOffering" inputmode="numeric"></div>
        </div>
      </section>

      <!-- PROCUREMENT -->
      <section class="section">
        <h2><i><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></i>Procurement</h2>

        <div class="row">
          <div class="group">
            <label>CP Procured By <span class="req">*</span></label>
            <select id="procuredBy" required onchange="toggleOther('procuredBy', 'procuredOther')">
              <option value="Anand Katawati">Anand Katawati</option>
              <option value="Jason Paul">Jason Paul</option>
              <option value="Anthony David">Anthony David</option>
              <option value="Aniyappan Achari">Aniyappan Achari</option>
              <option value="Roger Milton">Roger Milton</option>
              <option value="Joel Blesson">Joel Blesson</option>
              <option value="Baskaran DWP">Baskaran DWP</option>
              <option value="Ashok Kumar">Ashok Kumar</option>
              <option value="Other">Other</option>
            </select>
            <input type="text" id="procuredOther" class="hidden" placeholder="Enter Brother Name">
          </div>
          <div class="group">
            <label>CP Procured By Contact <span class="req">*</span></label>
            <input type="tel" id="procuredByContact" required placeholder="e.g. 9845012345">
          </div>
        </div>

        <div class="group">
          <label>Mode of Procurement</label>
          <select id="procurementMode" onchange="toggleOther('procurementMode', 'modeOther')">
            <option value="In Person Metting with Pastor">In Person Metting with Pastor</option>
            <option value="Over Telephonic Conversation with pastor">Over Telephonic Conversation with pastor</option>
            <option value="Through Friend">Through Friend</option>
            <option value="Through Google Searcch">Through Google Searcch</option>
            <option value="Through PAB contact">Through PAB contact</option>
            <option value="Other">Other</option>
          </select>
          <input type="text" id="modeOther" class="hidden" placeholder="Enter Mode of Procurement">
        </div>

        <div class="group"><label>Comments</label><textarea id="comments" rows="2"></textarea></div>
      </section>

      </div>
      </div>

      <div class="actions">
      <button type="submit" id="submitBtn">Submit Church Presentation</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <p class="foot">Gideons International</p>
  </div>

  <script>
    (function(){ const i=document.querySelector(".emblem img"); if(i){ const l=document.createElement("link"); l.rel="icon"; l.href=i.src; document.head.appendChild(l); } })();
    const API_URL = "https://script.google.com/macros/s/AKfycbxuJtvSgKGRfmZQyBZftKY78mjT8pXMBsBQEeNOd9lq_oTXBWyawIu2Q6TKV1-U6Dqe/exec";
    let directory = [];
    const badge = document.getElementById('dirBadge');
    const churchInput = document.getElementById('churchName');
    const sugBox = document.getElementById('suggestions');
    const campSelect = document.getElementById('campName');

    function toggleOther(selId, inputId) {
      const show = document.getElementById(selId).value === 'Other';
      const el = document.getElementById(inputId);
      el.style.display = show ? 'block' : 'none';
      el.required = show;
    }

    fetch(API_URL + "?action=boot")
      .then(r => r.json())
      .then(data => {
        directory = (data && data.churches) ? data.churches : [];
        const camps = (data && data.camps) ? data.camps : [];
        campSelect.innerHTML = '<option value="">-- Select Camp --</option>' +
          camps.map(c => `<option value="${c}">${c}</option>`).join('');
        badge.textContent = `Directory Ready (${directory.length} Verified Churches)`;
      })
      .catch(() => {
        badge.className = 'badge new';
        badge.textContent = 'Offline/Manual Mode — Enter details below';
      });

    churchInput.addEventListener('input', () => {
      const q = churchInput.value.trim().toLowerCase();
      sugBox.innerHTML = '';
      if (q.length < 2) { sugBox.style.display = 'none'; return; }

      const matches = directory.filter(c => c.church.toLowerCase().includes(q)).slice(0, 8);
      if (matches.length === 0) {
        sugBox.style.display = 'none';
        badge.className = 'badge new';
        badge.textContent = 'New Church — Will auto-add to Directory on submit';
        return;
      }

      matches.forEach(item => {
        const div = document.createElement('div');
        div.className = 'sug-item';
        div.innerHTML = `<div class="sug-title">${item.church}</div><div class="sug-sub">${item.camp || 'No Camp'} • ${item.pastor || 'Pastor'} • ${item.pin || ''}</div>`;
        div.onclick = () => selectChurch(item);
        sugBox.appendChild(div);
      });
      sugBox.style.display = 'block';
    });

    function selectChurch(c) {
      churchInput.value = c.church;
      if (c.camp) {
        if (!Array.from(campSelect.options).some(o => o.value === c.camp)) {
          campSelect.add(new Option(c.camp, c.camp));
        }
        campSelect.value = c.camp;
      }
      if (c.denom) {
        const dSel = document.getElementById('denomination');
        if (Array.from(dSel.options).some(o => o.value === c.denom)) {
          dSel.value = c.denom;
          toggleOther('denomination', 'denomOther');
        } else {
          dSel.value = 'Other';
          toggleOther('denomination', 'denomOther');
          document.getElementById('denomOther').value = c.denom;
        }
      }
      if (c.addr) document.getElementById('address').value = c.addr;
      if (c.pin) document.getElementById('pincode').value = c.pin;
      if (c.pastor) document.getElementById('pastorName').value = c.pastor;
      if (c.phone) document.getElementById('pastorPhone').value = c.phone;
      if (c.alt) document.getElementById('altContact').value = c.alt;
      if (c.email) document.getElementById('pastorEmail').value = c.email;
      if (c.lang) document.getElementById('primaryLang').value = c.lang;

      sugBox.style.display = 'none';
      badge.className = 'badge';
      badge.textContent = 'Matched Verified Church from Directory';
    }

    document.addEventListener('click', e => { if (!e.target.closest('.group')) sugBox.style.display = 'none'; });

    function getValOrOther(selId, otherId) {
      const v = document.getElementById(selId).value;
      return v === 'Other' ? document.getElementById(otherId).value : v;
    }

    function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const st = document.getElementById('status');
      btn.disabled = true;
      btn.textContent = 'Submitting & Triggering Alerts...';
      const norm91 = (v) => {
        const d = String(v || "").replace(/\D/g, "");
        if (!d) return "";
        if (d.length === 10) return "91" + d;
        if (d.length === 11 && d.startsWith("0")) return "91" + d.slice(1);
        return d;
      };
      const payload = {
        churchName: churchInput.value,
        campName: campSelect.value,
        presDate: document.getElementById('presDate').value,
        denomination: getValOrOther('denomination', 'denomOther'),
        pincode: document.getElementById('pincode').value,
        address: document.getElementById('address').value,
        area: document.getElementById('area').value,
        landmark: document.getElementById('landmark').value,
        pastorPrefix: document.getElementById('pastorPrefix').value,
        pastorName: document.getElementById('pastorName').value,
        pastorPhone: norm91(document.getElementById('pastorPhone').value),
        altContact: norm91(document.getElementById('altContact').value),
        pastorEmail: document.getElementById('pastorEmail').value,
        primaryLang: document.getElementById('primaryLang').value,
        translationAvail: document.getElementById('translationAvail').value,
        secondaryLang: document.getElementById('secondaryLang').value,
        startTime: document.getElementById('startTime').value,
        endTime: document.getElementById('endTime').value,
        lcdProjector: document.getElementById('lcdProjector').value,
        sermonRequired: document.getElementById('sermonRequired').value,
        duration: document.getElementById('duration').value,
        offeringType: document.getElementById('offeringType').value,
        congregationSize: document.getElementById('congregationSize').value,
        expectedOffering: document.getElementById('expectedOffering').value,
        procuredBy: getValOrOther('procuredBy', 'procuredOther'),
        procuredByContact: norm91(document.getElementById('procuredByContact').value),
        procurementMode: getValOrOther('procurementMode', 'modeOther'),
        comments: document.getElementById('comments').value
      };
      const submitUrl = API_URL + "?action=submit&data=" + encodeURIComponent(JSON.stringify(payload));

      fetch(submitUrl)
        .then(r => r.json())
        .then(res => {
          if (!res.ok) throw new Error(res.error || "Submission failed");
          st.style.display = 'block';
          st.className = 'ok';
          st.textContent = `Submitted! Booking ID: ${res.id} (Row ${res.row}). Stage 0 WhatsApp alerts triggered.`;
          btn.disabled = false;
          btn.textContent = 'Submit Another Request';
          document.getElementById('presForm').reset();
          st.scrollIntoView({ behavior: 'smooth', block: 'center' });
        })
        .catch(err => {
          st.style.display = 'block';
          st.className = 'err';
          st.textContent = 'Error: ' + err.message;
          btn.disabled = false;
          btn.textContent = 'Submit Church Presentation';
          st.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
    }
  </script>
</body>
</html>
